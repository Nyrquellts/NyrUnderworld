# The NYR Underworld development server.
#
# Loopback only, on purpose: nothing outside this machine can reach it. To let
# somebody else in, change 127.0.0.1 to 0.0.0.0, forward the port, and
# understand that you are then running a public server.
#
# The licence key is NOT in this file and must never be. It is read from the
# FIVEM_LICENSE_KEY environment variable and passed on the command line by
# tools\devserver.cmd, so it is never written to disk.

endpoint_add_tcp "127.0.0.1:30120"
endpoint_add_udp "127.0.0.1:30120"

sv_maxclients 8
sv_hostname "NYR UNDERWORLD"
sets sv_projectName "NYR UNDERWORLD"
sets sv_projectDesc "The city remembers."

# LAN mode keeps this off the public server list. It does NOT skip the licence
# check, whatever the documentation says -- measured on both servers.
sv_lan true
sv_master1 ""

# No script hook: it lets a client run arbitrary native code, which is the one
# thing that makes every server-side rule in this resource negotiable.
sv_scriptHookAllowed 0

ensure nyr_underworld
