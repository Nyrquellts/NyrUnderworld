<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Underworld interface review</title>
<style>body{margin:0;background:#151310;color:#efe7dc;font:14px system-ui}nav{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:14px 22px;border-bottom:1px solid #584934}a{color:#d99a3f}strong{margin-right:auto}iframe{border:0;width:100%;height:calc(100vh - 130px)}pre{margin:0;padding:12px 22px;white-space:pre-wrap;color:#d8c9b3}button{background:#292219;color:#efe7dc;border:1px solid #79613e;padding:8px;cursor:pointer}</style>
<nav><strong>Actual NUI · synthetic fixture data</strong><button data-screen="picker">Characters</button><button data-screen="pockets">Pockets</button><button data-screen="phone">Phone</button><button data-screen="shop">Shop</button><button data-screen="stash">Stash</button><button data-screen="nearby">Nearby</button><button data-screen="bank">Bank</button><button data-screen="jobs">Work</button><a href="/docs/store/index.html">Store draft</a></nav>
<iframe title="Underworld interface" src="/adapter/nui/index.html?screen=picker"></iframe><pre id="requests" aria-live="polite">UI review only. Native focus, positioning, game performance and server behavior are not tested here.</pre>
<script>const frame=document.querySelector('iframe');for(const b of document.querySelectorAll('[data-screen]'))b.onclick=()=>{frame.src='/adapter/nui/index.html?screen='+b.dataset.screen;document.getElementById('requests').textContent='No requests yet.'};window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data.type==='fixture-request')document.getElementById('requests').textContent=JSON.stringify(e.data.request)})</script>
</html>
